apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hydra-sqlite
  namespace: shanghaitech-auth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# --- Hydra Migration Job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: hydra-migrate
  namespace: shanghaitech-auth
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hydra-migrate
          image: oryd/hydra:v25.4.0
          command: ["hydra", "migrate", "sql", "up", "-e", "--yes"]
          env:
            - name: DSN
              value: "sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc"
          volumeMounts:
            - name: sqlite
              mountPath: /mnt/sqlite
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: hydra-sqlite
---
# --- Hydra Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  namespace: shanghaitech-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra
  template:
    metadata:
      labels:
        app: hydra
    spec:
      containers:
        - name: hydra
          image: oryd/hydra:v25.4.0
          command: ["hydra", "serve", "all"]
          args:
            - "--dangerous-force-http"  # Remove if using TLS termination at Hydra level
          ports:
            - name: public
              containerPort: 4444
            - name: admin
              containerPort: 4445
          env:
            - name: DSN
              value: "sqlite:///mnt/sqlite/db.sqlite?_fk=true&mode=rwc"
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: shanghaitech-auth-config
                  key: APP_URL
            - name: URLS_SELF_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: shanghaitech-auth-config
                  key: HYDRA_PUBLIC_URL
            - name: URLS_LOGIN
              value: "$(APP_URL)/login"
            - name: URLS_CONSENT
              value: "$(APP_URL)/consent"
            - name: SECRETS_SYSTEM
              valueFrom:
                secretKeyRef:
                  name: shanghaitech-auth-secrets
                  key: SECRETS_SYSTEM
            - name: OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES
              value: "public,pairwise"
            - name: OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
              valueFrom:
                secretKeyRef:
                  name: shanghaitech-auth-secrets
                  key: OIDC_PAIRWISE_SALT
            - name: SERVE_PUBLIC_CORS_ENABLED
              value: "true"
            - name: SERVE_PUBLIC_CORS_ALLOWED_ORIGINS
              value: "$(APP_URL)"
            - name: SERVE_ADMIN_CORS_ENABLED
              value: "false"
          volumeMounts:
            - name: sqlite
              mountPath: /mnt/sqlite
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4444
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4444
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: hydra-sqlite
---
# --- Hydra Service ---
apiVersion: v1
kind: Service
metadata:
  name: hydra
  namespace: shanghaitech-auth
spec:
  selector:
    app: hydra
  ports:
    - name: public
      port: 4444
      targetPort: 4444
    - name: admin
      port: 4445
      targetPort: 4445
