apiVersion: v1
kind: ConfigMap
metadata:
  name: shanghaitech-auth-config
  namespace: shanghaitech-auth
data:
  # --- Public URLs (change to your domain) ---
  APP_URL: "https://auth.example.com"
  HYDRA_PUBLIC_URL: "https://hydra.example.com"

  # --- Internal URLs (K8s service DNS) ---
  HYDRA_ADMIN_URL: "http://hydra:4445"

  # --- OAuth Client ---
  CLIENT_ID: "shanghaitech-ids"
  CLIENT_NAME: "ShanghaiTech IDS Login"
  CLIENT_SCOPE: "openid profile email"
  GRANT_TYPES: "authorization_code,refresh_token"
