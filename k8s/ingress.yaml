# Example Ingress — adjust for your ingress controller (nginx, traefik, etc.)
# If using cert-manager, uncomment the TLS section.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shanghaitech-auth-ingress
  namespace: shanghaitech-auth
  annotations:
    # nginx example:
    # nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    # cert-manager example:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx  # Change to your ingress class
  rules:
    - host: auth.example.com    # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 3000
    - host: hydra.example.com   # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hydra
                port:
                  number: 4444
  # tls:
  #   - hosts:
  #       - auth.example.com
  #       - hydra.example.com
  #     secretName: shanghaitech-auth-tls
