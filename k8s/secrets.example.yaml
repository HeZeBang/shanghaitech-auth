# Copy to secrets.yaml, fill in base64-encoded values, then apply.
# Generate values:
#   echo -n "your-value" | base64
# Or use kubectl directly:
#   kubectl create secret generic shanghaitech-auth-secrets \
#     --namespace shanghaitech-auth \
#     --from-literal=SECRETS_SYSTEM=$(openssl rand -hex 32) \
#     --from-literal=OIDC_PAIRWISE_SALT=$(openssl rand -hex 32) \
#     --from-literal=CLIENT_SECRET=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: shanghaitech-auth-secrets
  namespace: shanghaitech-auth
type: Opaque
data:
  SECRETS_SYSTEM: Q0hBTkdFX01F       # base64 of your value
  OIDC_PAIRWISE_SALT: Q0hBTkdFX01F   # base64 of your value
  CLIENT_SECRET: Q0hBTkdFX01F         # base64 of your value
